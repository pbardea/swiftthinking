version: 2.1

jobs:
  build-and-test:
    macos:
      xcode: 15.0.0
    environment:
      # Ensure we're using the correct platform
      DEVELOPER_DIR: /Applications/Xcode-15.0.app/Contents/Developer
    steps:
      - checkout
      - run:
          name: Show Xcode version
          command: xcodebuild -version
      - run:
          name: Build
          command: |
            xcodebuild build \
              -project SwiftThinking.xcodeproj \
              -scheme SwiftThinking \
              -destination 'platform=macOS' \
              -configuration Debug \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
      - run:
          name: Run tests
          command: |
            xcodebuild test \
              -project SwiftThinking.xcodeproj \
              -scheme SwiftThinking \
              -destination 'platform=macOS' \
              -configuration Debug \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
      - run:
          name: Generate test results
          command: |
            mkdir -p test-results
            xcodebuild test \
              -project SwiftThinking.xcodeproj \
              -scheme SwiftThinking \
              -destination 'platform=macOS' \
              -resultBundlePath test-results/results.xcresult \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO || true
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results

workflows:
  version: 2
  build-test:
    jobs:
      - build-and-test